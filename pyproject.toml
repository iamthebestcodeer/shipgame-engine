[project]
name = "shipgame-ai"
version = "0.1.0"
description = "CPU-first simulator and Torch PPO agent for Mk48-style naval combat"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "torch>=2.6,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=7.4,<8",
  "pytest-testmon>=1.3,<2",
  "setuptools<81",
  "ruff>=0.9,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipgame_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.mypy]
python_version = "3.12"
strict = true
disable_error_code = ["no-untyped-call"]
mypy_path = "src"
files = ["src", "tests"]
